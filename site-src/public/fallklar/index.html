<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fallklar</title>
</head>
<body>
<p id="status" style="font:16px system-ui,sans-serif;padding:32px">Fallklar wird geladen …</p>
<script>
(async()=>{
  try{
    const files=['page-0.txt','page-1.txt','page-2.txt'];
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));
    const raw=atob(parts.join(''));
    const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('status').textContent='Die Seite konnte nicht geladen werden.';console.error(e)}
})();
</script>
</body>
</html>
